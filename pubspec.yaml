name: h20remind
description: Track your daily water intake and get gentle reminders to stay hydrated.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
